<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minestrator Starter - Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-6">
    <!-- En-tête -->
    <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎮</span>
        <h1 class="text-xl font-bold text-white">Minestrator Panel</h1>
      </div>
      <span id="badge-status" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-red-500/10 text-red-400 border border-red-500/20">
        Déconnecté
      </span>
    </div>

    <!-- Écran de Connexion -->
    <div id="auth-section" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Email</label>
        <input type="email" id="email" value="admin@dlp.fr" placeholder="admin@dlp.fr" class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500 transition-colors">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500 transition-colors">
      </div>
      <button onclick="login()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition-colors shadow-lg shadow-emerald-900/20">
        Se connecter
      </button>
    </div>

    <!-- Écran de Contrôle (Masqué par défaut) -->
    <div id="control-section" class="space-y-4 hidden">
      <p class="text-sm text-gray-400">Connecté en tant que : <span id="user-display" class="font-bold text-white"></span></p>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="sendAction('start')" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition shadow-md shadow-emerald-900/30 flex items-center justify-center space-x-2">
          <span>▶</span><span>Démarrer</span>
        </button>
        <button onclick="sendAction('stop')" class="py-3 px-4 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg transition shadow-md shadow-rose-900/30 flex items-center justify-center space-x-2">
          <span>⏹</span><span>Arrêter</span>
        </button>
        <button onclick="sendAction('restart')" class="py-3 px-4 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-lg transition shadow-md shadow-amber-900/30 flex items-center justify-center space-x-2">
          <span>🔄</span><span>Redémarrer</span>
        </button>
        <button onclick="sendAction('status')" class="py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition shadow-md shadow-blue-900/30 flex items-center justify-center space-x-2">
          <span>📊</span><span>Statut</span>
        </button>
      </div>

      <button onclick="logout()" class="w-full mt-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium rounded-lg text-sm transition">
        Déconnexion
      </button>
    </div>

    <!-- Console de réponse -->
    <div class="mt-6 pt-4 border-t border-gray-800">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Console de réponse</label>
      <pre id="status" class="p-3 bg-gray-950 border border-gray-800 rounded-lg text-xs font-mono text-gray-300 overflow-x-auto min-h-[60px] whitespace-pre-wrap">En attente de connexion...</pre>
    </div>
  </div>

  <script>
    // === CONFIGURATION SUPABASE ===
    const SUPABASE_URL = "https://artvfaksorvfyhkbbsch.supabase.co"
    const SUPABASE_ANON_KEY = "sb_publishable_iN_Yj8VzRmkg8aWEx0Ru8w_2ks11X7t"

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function login() {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const statusEl = document.getElementById('status')

      statusEl.innerText = "Connexion en cours..."
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })
      
      if (error) {
        statusEl.innerText = "Erreur de connexion : " + error.message
      } else {
        document.getElementById('auth-section').classList.add('hidden')
        document.getElementById('control-section').classList.remove('hidden')
        document.getElementById('user-display').innerText = data.user.email
        
        const badge = document.getElementById('badge-status')
        badge.innerText = "Connecté"
        badge.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
        
        statusEl.innerText = "Connecté avec succès. Prêt à exécuter des commandes."
      }
    }

    async function sendAction(action) {
      const statusEl = document.getElementById('status')
      statusEl.innerText = "Envoi de la commande '" + action + "' à Minestrator..."
      
      const { data, error } = await supabaseClient.rpc('manage_server', {
        p_action: action
      })

      if (error) {
        statusEl.innerText = "Erreur : " + error.message
      } else {
        statusEl.innerText = JSON.stringify(data, null, 2)
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut()
      location.reload()
    }
  </script>
</body>
</html>
